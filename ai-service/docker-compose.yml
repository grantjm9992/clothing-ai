version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing-ai-service
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./models:/app/models
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    networks:
      - clothing-ai
    ports:
      - "8001:8001"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clothing-ai-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - clothing-ai
    ports:
      - "6333:6333"
      - "6334:6334"

networks:
  clothing-ai:
    driver: bridge

volumes:
  qdrant-data:
