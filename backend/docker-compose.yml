version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing-ai-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - clothing-ai
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: clothing-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clothing_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clothing-ai
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: clothing-ai-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - clothing-ai
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: clothing-ai-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - clothing-ai

networks:
  clothing-ai:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
